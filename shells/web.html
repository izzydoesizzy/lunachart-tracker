  <script>
  // Theme boot: apply saved theme before first paint (no flash)
  try{
    var s=JSON.parse(localStorage.getItem('lc-settings')||'{}');
    if(s.theme==='night')document.documentElement.dataset.theme='dark';
    else if(s.theme==='day')document.documentElement.dataset.theme='light';
  }catch(e){}
  </script>

if (!window.storage) {
  window.storage = {
    get: async (k) => { const v = localStorage.getItem(k); return v ? { value: v } : null; },
    set: async (k, v) => { localStorage.setItem(k, v); },
    remove: async (k) => { localStorage.removeItem(k); },
